<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تماس با منشی مطب دکتر هاشمی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#6C5CE7; --violet-deep:#5244B8; --violet-soft:#EBE9FB;
    --ink:#2B2A40; --ink-soft:#6B6885; --sage:#F0EFF9; --paper:#FDFDFF; --alert:#C2415B;
    --level:0;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ font-family:'Vazirmatn',sans-serif; color:var(--ink); background:var(--sage); line-height:1.7;
        min-height:100dvh; display:flex; justify-content:center; }
  main{ width:100%; max-width:440px; padding:28px 16px 24px; display:flex; flex-direction:column; min-height:100dvh; }

  header{ text-align:center; }
  header h1{ font-size:1.15rem; font-weight:800; margin:0; letter-spacing:0; }
  header p{ margin:2px 0 0; color:var(--ink-soft); font-size:.88rem; }

  /* the orb: the one expressive element on the page */
  .stage{ display:flex; flex-direction:column; align-items:center; padding:36px 0 20px; }
  .orb-wrap{ position:relative; width:212px; height:212px; display:grid; place-items:center; }
  .level, .ripple, .arc{ position:absolute; inset:0; border-radius:50%; pointer-events:none; }
  .level{ background:var(--violet-soft); transform:scale(calc(.78 + var(--level) * .5)); transition:transform 80ms linear; opacity:0; }
  .arc{ opacity:0; background:conic-gradient(from 0deg, transparent 0 70%, var(--violet) 70% 100%);
        -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
                mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); }
  .ripple{ border:2px solid var(--violet); opacity:0; }
  .orb{ position:relative; width:148px; height:148px; border-radius:50%; border:0; cursor:pointer;
        background:var(--violet); color:#fff; display:grid; place-items:center;
        box-shadow:0 18px 40px -18px rgba(82,68,184,.55), 0 4px 10px -4px rgba(82,68,184,.35);
        transition:transform .25s cubic-bezier(.34,1.56,.64,1), background-color .2s; }
  .orb:hover{ background:var(--violet-deep); }
  .orb:active{ transform:scale(.96); }
  .orb:focus-visible{ outline:3px solid var(--ink); outline-offset:6px; }
  .orb svg{ width:52px; height:52px; }
  .orb[disabled]{ cursor:default; }

  body[data-state="listening"] .level{ opacity:1; }
  body[data-state="thinking"] .arc{ opacity:1; animation:spin 1.1s linear infinite; }
  body[data-state="speaking"] .ripple{ animation:ripple 1.6s ease-out infinite; }
  body[data-state="speaking"] .ripple.r2{ animation-delay:.8s; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes ripple{ from{ transform:scale(.72); opacity:.55; } to{ transform:scale(1.08); opacity:0; } }

  .status{ margin-top:18px; font-weight:700; font-size:1.05rem; min-height:1.8em; text-align:center; }
  .hint{ margin:2px 0 0; color:var(--ink-soft); font-size:.85rem; text-align:center; min-height:1.6em; }
  .error{ color:var(--alert); }

  /* transcript */
  .log{ flex:1; display:flex; flex-direction:column; gap:10px; padding:4px 0 16px; }
  .msg{ max-width:86%; padding:10px 14px; border-radius:18px; font-size:.95rem; }
  .msg.agent{ align-self:flex-end; background:var(--paper); border-end-end-radius:6px;
              box-shadow:0 1px 2px rgba(43,42,64,.06); }
  .msg.caller{ align-self:flex-start; background:var(--violet-soft); color:var(--violet-deep); border-end-start-radius:6px; }

  .end{ align-self:center; margin-top:4px; border:0; border-radius:999px; padding:12px 30px; cursor:pointer;
        font:700 .95rem 'Vazirmatn',sans-serif; color:#fff; background:var(--alert);
        transition:transform .2s cubic-bezier(.34,1.56,.64,1), filter .2s; }
  .end:hover{ filter:brightness(.92); }
  .end:active{ transform:scale(.96); }
  .end:focus-visible{ outline:3px solid var(--ink); outline-offset:4px; }

  form.type{ display:flex; gap:8px; margin-top:10px; }
  form.type input{ flex:1; font:inherit; padding:10px 14px; border-radius:14px; border:1.5px solid #d9d6f0; background:var(--paper); color:var(--ink); }
  form.type input:focus-visible{ outline:none; border-color:var(--violet); }
  form.type button{ font:700 .9rem 'Vazirmatn',sans-serif; border:0; border-radius:14px; padding:0 16px; background:var(--ink); color:#fff; cursor:pointer; }
  form.type button:hover{ background:#3b3a55; }
  form.type button:focus-visible{ outline:3px solid var(--violet); outline-offset:2px; }

  footer{ margin-top:18px; text-align:center; color:var(--ink-soft); font-size:.8rem; }
  [hidden]{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    .level{ transition:none; }
    body[data-state="thinking"] .arc{ animation:none; background:conic-gradient(var(--violet) 0 100%); }
    body[data-state="speaking"] .ripple{ animation:none; opacity:.4; transform:scale(1); }
    .orb, .end{ transition:none; }
  }
</style>
</head>
<body data-state="idle">
<main>
  <header>
    <h1>مطب دکتر فروغ هاشمی</h1>
    <p>متخصص کودکان، کرج</p>
  </header>

  <section class="stage">
    <div class="orb-wrap">
      <div class="level"></div>
      <div class="ripple"></div><div class="ripple r2"></div>
      <div class="arc"></div>
      <button class="orb" id="orb" type="button" aria-label="شروع تماس">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>
        </svg>
      </button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">برای گرفتن نوبت، تماس بگیرید</div>
    <p class="hint" id="hint">دستیار هوشمند مطب جواب می‌دهد و نوبت را ثبت می‌کند.</p>
  </section>

  <section class="log" id="log" aria-label="متن گفتگو"></section>

  <form class="type" id="typeForm" hidden>
    <input id="typeInput" autocomplete="off" placeholder="متن خود را بنویسید…" aria-label="پیام نوشتاری">
    <button type="submit">ارسال</button>
  </form>
  <button class="end" id="endBtn" type="button" hidden>پایان تماس</button>

  <footer>این خط فقط برای نوبت‌گیری است و مشاوره‌ی پزشکی نمی‌دهد. در شرایط اورژانسی با ۱۱۵ تماس بگیرید.</footer>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const orb = $('orb'), statusEl = $('status'), hintEl = $('hint'), logEl = $('log'), endBtn = $('endBtn');
  const typeForm = $('typeForm'), typeInput = $('typeInput');
  const debugText = new URLSearchParams(location.search).has('debug');

  const player = new Audio();          // one element, unlocked on the first tap (needed on iOS)
  // 0.1 s of silent WAV, played on the first tap to unlock audio playback.
  const SILENT = (() => {
    const n = 800, b = new ArrayBuffer(44 + n), v = new DataView(b);
    const w = (o, str) => [...str].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true);
    v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true); for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
    return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
  })();

  let sid = null, stream = null, ctx = null, analyser = null, recorder = null, timer = null;
  let state = 'idle', mime = '', textMode = false, slow = false;   // slow: caller is giving a long number

  function setState(s, status, hint = '') {
    state = s; document.body.dataset.state = s;
    if (status !== undefined) statusEl.textContent = status;
    hintEl.textContent = hint; hintEl.classList.remove('error');
    if (s === 'idle') document.body.style.setProperty('--level', 0);
  }
  function showError(status, hint) { setState('idle', status, hint); hintEl.classList.add('error'); }
  function addMsg(who, text) {
    if (!text) return;
    const d = document.createElement('div');
    d.className = 'msg ' + who; d.textContent = text;
    logEl.appendChild(d); d.scrollIntoView({ block: 'end', behavior: 'smooth' });
  }

  function pickMime() {
    for (const m of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'])
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
    return '';
  }

  async function start() {
    orb.disabled = true;
    player.src = SILENT; player.play().catch(() => {});
    setState('thinking', 'در حال اتصال…');
    let r;
    const k = new URLSearchParams(location.search).get('k') || '';
    try { r = await (await fetch('/api/start' + (k ? '?k=' + encodeURIComponent(k) : ''), { method: 'POST' })).json(); }
    catch { orb.disabled = false; return showError('اتصال برقرار نشد', 'اینترنت را بررسی کنید و دوباره تماس بگیرید.'); }
    if (r.error === 'access') { orb.disabled = false; return showError('این لینک فعال نیست', 'برای تماس از لینک کاملی که دریافت کرده‌اید استفاده کنید.'); }
    if (!r.ok) { orb.disabled = false; return showError('الان امکان تماس نیست', 'چند دقیقه‌ی دیگر دوباره امتحان کنید.'); }
    sid = r.sid;
    textMode = debugText || !r.stt;
    if (!textMode) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      } catch {
        orb.disabled = false; sid = null;
        return showError('به میکروفون دسترسی نداریم', 'در تنظیمات مرورگر اجازه‌ی میکروفون را بدهید و دوباره تماس بگیرید.');
      }
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      await ctx.resume();
      analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
      ctx.createMediaStreamSource(stream).connect(analyser);
      mime = pickMime();
    }
    endBtn.hidden = false; typeForm.hidden = !textMode;
    orb.setAttribute('aria-label', 'تماس برقرار است');
    await say(r.reply, r.audio);
    next();
  }

  // Play the agent's reply; resolves when it has finished speaking.
  // audio: a whole MP3 (base64) for fixed phrases; audioUrl: a reply streamed while it's still being synthesized.
  function say(text, audio, audioUrl) {
    addMsg('agent', text);
    setState('speaking', 'دستیار صحبت می‌کند…');
    return new Promise((resolve) => {
      if (!audio && !audioUrl) return setTimeout(resolve, Math.min(6000, 600 + text.length * 45));
      player.onended = player.onerror = () => resolve();
      player.src = audioUrl || ('data:audio/mpeg;base64,' + audio);
      player.play().catch(() => resolve());
    });
  }

  function next() {
    if (!sid) return;
    if (textMode) { setState('listening', 'بنویسید', 'پیام خود را بنویسید و ارسال کنید.'); typeInput.focus(); return; }
    listen();
  }

  // Simple voice-activity detection: record until ~0.8 s of silence follows speech (2 s while giving a number).
  function listen() {
    setState('listening', 'گوش می‌دهم…', 'صحبت کنید؛ وقتی ساکت شوید، دستیار جواب می‌دهد.');
    const chunks = [];
    recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    let floor = 0.01, voiced = 0, silent = 0, spoken = false, elapsed = 0, discard = false;
    recorder.onstop = () => {
      if (discard || !sid) return;
      if (!spoken) return listen();
      send(new Blob(chunks, { type: recorder.mimeType || mime || 'audio/webm' }));
    };
    recorder.start(250);
    const buf = new Float32Array(analyser.fftSize);
    clearInterval(timer);
    timer = setInterval(() => {
      analyser.getFloatTimeDomainData(buf);
      let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      const rms = Math.sqrt(sum / buf.length);
      const thr = Math.max(0.012, floor * 2.6);
      document.body.style.setProperty('--level', Math.min(1, rms / 0.12).toFixed(3));
      elapsed += 50;
      if (rms > thr) { voiced += 50; silent = 0; if (voiced >= 150) spoken = true; }
      else { voiced = 0; if (spoken) silent += 50; else floor = floor * 0.95 + rms * 0.05; }
      const done = spoken && (silent >= (slow ? 2000 : 800) || elapsed >= 25000);
      const idleTooLong = !spoken && elapsed >= 15000;   // restart so the clip stays small
      if (done || idleTooLong) { clearInterval(timer); recorder.stop(); }
    }, 50);
    endBtn.onclick = () => { discard = true; clearInterval(timer); try { recorder.stop(); } catch {} hangup(); };
  }

  async function send(body) {
    setState('thinking', 'یک لحظه…');
    const isText = typeof body === 'string';
    let r;
    try {
      const res = await fetch('/api/turn?sid=' + encodeURIComponent(sid), {
        method: 'POST',
        headers: { 'content-type': isText ? 'application/json' : body.type },
        body: isText ? JSON.stringify({ text: body }) : body,
      });
      r = await res.json();
      if (!res.ok) {
        if (res.status === 404) return hangup('تماس به پایان رسید.');
        if (res.status === 429) return hangup('تعداد تماس‌ها زیاد است؛ کمی بعد دوباره تماس بگیرید.');
        throw new Error(r.error || res.status);
      }
    } catch {
      await say('ارتباط قطع شد. دوباره صحبت کنید.', null);
      return next();
    }
    if (r.transcript && !isText) addMsg('caller', r.transcript);
    await say(r.reply, r.audio, r.audioUrl);
    if (r.end) return hangup('تماس به پایان رسید. روز خوبی داشته باشید.');
    slow = !!r.slow;
    next();
  }

  function hangup(msg) {
    clearInterval(timer);
    if (sid) fetch('/api/end?sid=' + encodeURIComponent(sid), { method: 'POST', keepalive: true }).catch(() => {});
    sid = null;
    player.pause();
    if (stream) stream.getTracks().forEach((t) => t.stop());
    if (ctx) ctx.close().catch(() => {});
    stream = ctx = analyser = recorder = null;
    endBtn.hidden = true; typeForm.hidden = true; orb.disabled = false;
    orb.setAttribute('aria-label', 'تماس دوباره');
    setState('idle', typeof msg === 'string' ? msg : 'تماس تمام شد', 'برای تماس دوباره، دکمه را بزنید.');
  }

  orb.addEventListener('click', () => { if (state === 'idle' && !sid) start(); });
  endBtn.onclick = () => hangup();
  typeForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const t = typeInput.value.trim();
    if (!t || state !== 'listening') return;
    addMsg('caller', t); typeInput.value = '';
    send(t);
  });
  addEventListener('pagehide', () => { if (sid) hangup(); });
})();
</script>
</body>
</html>
